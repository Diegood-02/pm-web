# Publica la demo de solo lectura del frontend en GitHub Pages.
# No incluye el backend: la demo usa datos de ejemplo guardados en frontend/src/demo/snapshot.json.
name: Demo en GitHub Pages

on:
  push:
    branches: [feature/mvp-pm-web]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Pruebas
        working-directory: frontend
        run: npx vitest run

      - name: Compilar la demo
        working-directory: frontend
        env:
          VITE_DEMO: "true"
          VITE_ROUTER_MODE: hash
          VITE_BASE_PATH: /pm-web/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
