name: pm-web

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pm}
      # Obligatorio: define POSTGRES_PASSWORD en .env (no hay valor por defecto).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-pm_web}
    ports:
      # La base solo es accesible desde este equipo.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pm} -d ${POSTGRES_DB:-pm_web}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en el archivo .env}
    ports:
      # API_BIND=0.0.0.0 en .env la publica en la red del piloto; por defecto solo local.
      - "${API_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      # El navegador llama a la API desde el host, no desde la red interna de Docker.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_BIND:-127.0.0.1}:5173:5173"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  db-data:
  web-node-modules:
